---
- hosts: rescue
  gather_facts: false
  become: true
  vars:
    target_mount: /mnt
    bind_dirs:
      - /dev
      - /proc
      - /sys
      - /run

  tasks:
    - name: Detect OS partition
      include_role:
        name: mount-probe

    - name: Mount OS partition
      ansible.posix.mount:
        path: "{{ target_mount }}"
        src: "{{ detected_root }}"
        state: mounted
        opts: defaults
        fstype: auto

    - name: Make sure bind-mount targets exist
      file:
        path: "{{ target_mount }}{{ item }}"
        state: directory
      loop: "{{ bind_dirs }}"

    - name: Bind-mount runtime directories
      ansible.posix.mount:
        path: "{{ target_mount }}{{ item }}"
        src: "{{ item }}"
        state: mounted
        opts: bind
        fstype: auto
      loop: "{{ bind_dirs }}"

    - name: Generate password for root user
      ansible.builtin.set_fact:
        root_password: "{{ lookup('ansible.builtin.password', '/dev/null length=16 chars=ascii_letters,digits') }}"

    - name: Set root password inside the chroot
      command:
        cmd: chroot "{{ target_mount }}" passwd root
        stdin: "{{ root_password }}\n{{ root_password }}\n"
    - name: Flush filesystem changes to disk
      command: sync
      changed_when: false

    - name: Umount bind directories
      command: umount -R "{{ target_mount }}"

    - name: Debug root password
      ansible.builtin.debug:
        var: root_password
